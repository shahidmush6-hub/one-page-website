<!DOCTYPE html>
<html>
<head>
    <title>My One Page Website</title>
<style>
.lightbox{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
justify-content:center;
align-items:center;
}

.lightbox img{
max-width:80%;
max-height:80%;
}

img{
cursor:pointer;
}
</style>
</head>
<div id="lightbox" class="lightbox" onclick="closeModal()">
  <img id="lightbox-img">
</div>

<body>

    <!-- Navigation -->
    <nav>
        <a href="#home">Home</a> |
        <a href="#gallery">Gallery</a> |
        <a href="#video">Video</a> |
        <a href="#contact">Contact</a>
    </nav>

    <hr>

    <!-- Home Section -->
    <section id="home">
        <h1>Welcome to My Website</h1>
        <p>This is my one-page HTML website assignment.</p>
    </section>

    <hr>

    <!-- Pictures Section -->
    <section id="gallery">
    <h2>Gallery</h2>

   <img src="https://picsum.photos/200" alt="Sample Image 1" onclick="openModal(this)">
<img src="https://picsum.photos/201" alt="Sample Image 2" onclick="openModal(this)">
</section>

    <hr>

    <!-- Video Section -->
    <section id="video">
    <h2>My Favorite Video</h2>

  <iframe width="560" height="315"
src="https://www.youtube.com/embed/dQw4w9WgXcQ"
allowfullscreen>
</iframe>


</section>

    <hr>

    <!-- Contact Form -->
    <section id="contact">
        <h2>Contact Me</h2>
        <form>
            <label>Name:</label><br>
            <input type="text" name="name"><br><br>

            <label>Email:</label><br>
            <input type="email" name="email"><br><br>

            <label>Message:</label><br>
            <textarea name="message"></textarea><br><br>

            <input type="submit" value="Send">
        </form>
    </section>

    <hr>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 My One Page Website</p>
    </footer>
<script>
function openModal(img){
document.getElementById("lightbox").style.display="flex";
document.getElementById("lightbox-img").src = img.src;
}

function closeModal(){
document.getElementById("lightbox").style.display="none";
}
</script>

</body>
</html>
